<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="data/myself.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage" id="stage" aria-label="动态电影海报墙">

      <a class="glass-pane" id="glass" href="https://sunyue.xin/CV/" target="_blank" rel="noopener">

    <button class="theme-toggle" id="theme-toggle" aria-label="切换黑白背景"></button>
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position: absolute" color-interpolation-filters="sRGB" aria-hidden="true">
      <defs id="svg-defs"></defs>

    <script src="script.js?v=3"></script>
